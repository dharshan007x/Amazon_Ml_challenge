# ============================================================
# Amazon ML Challenge - Business Entity Resolution
# Central Configuration File
# ============================================================

random_seed: 42

# ----------------------------------------------------------
# Data paths (relative to project root)
# ----------------------------------------------------------
data:
  train_dir: "dataset/train"
  test_dir: "dataset/test"
  output_dir: "output"

# ----------------------------------------------------------
# Text Normalization
# ----------------------------------------------------------
normalization:
  legal_suffixes:
    - corp
    - corporation
    - co
    - company
    - ltd
    - limited
    - pvt
    - private
    - llc
    - inc
    - incorporated
    - lp
    - llp
    - plc
    - gmbh
    - sarl
    - sas
    - sa
    - ag
    - bv
    - nv
    - pty
    - pte
    - sdn
    - bhd

  address_expansions:
    " rd ": " road "
    " st ": " street "
    " ave ": " avenue "
    " blvd ": " boulevard "
    " dr ": " drive "
    " ln ": " lane "
    " ct ": " court "
    " pl ": " place "
    " sq ": " square "
    " hwy ": " highway "

  name_ngram_range: [3, 4]
  addr_ngram_range: [3, 4]

# ----------------------------------------------------------
# Blocking / Candidate Generation
# ----------------------------------------------------------
blocking:
  tfidf_top_k: 40
  token_top_k: 30
  min_token_len: 3
  rare_token_idf_threshold: 3.0
  name_prefix_lengths: [4, 5, 6]

# ----------------------------------------------------------
# Features
# ----------------------------------------------------------
features:
  ngram_sizes: [3, 4]
  use_cross_source: true
  use_blocking_evidence: true

# ----------------------------------------------------------
# Training
# ----------------------------------------------------------
training:
  train_sample_size: 40000
  val_fraction: 0.2
  n_folds: 5
  hard_negative_ratio: 4
  random_negative_ratio: 6
  hard_negative_iterations: 1

# ----------------------------------------------------------
# Model
# ----------------------------------------------------------
model:
  name: "lightgbm"
  params:
    n_estimators: 1000
    learning_rate: 0.05
    max_depth: 7
    num_leaves: 63
    min_child_samples: 20
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 5
    reg_alpha: 0.1
    reg_lambda: 0.1
    random_state: 42
    n_jobs: -1
    verbose: -1
  early_stopping_rounds: 50

# ----------------------------------------------------------
# Decision / Threshold
# ----------------------------------------------------------
decision:
  threshold_sweep:
    - 0.50
    - 0.55
    - 0.60
    - 0.65
    - 0.70
    - 0.75
    - 0.80
    - 0.82
    - 0.84
    - 0.86
    - 0.88
    - 0.90
    - 0.92
    - 0.94
    - 0.96
    - 0.98
  default_threshold: 0.75
  source_specific_thresholds: true
  min_entity_score: 0.40
  margin_threshold: 0.15

# ----------------------------------------------------------
# Output Paths
# ----------------------------------------------------------
paths:
  experiments: "experiments/results.csv"
  submissions: "submissions"
  models: "models"
  logs: "logs"
  matching_results: "output/matching_results.tsv"
  candidate_pairs: "output/candidate_pairs.tsv"
